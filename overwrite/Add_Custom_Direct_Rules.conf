[YAML]
# Name: Add Custom Direct Rules
# Author: Aethersailor
# Project: Custom_OpenClash_Rules
# Description: 为使用其他规则方案的配置附加本项目维护的域名与 IP 直连规则
# Compatibility: 需 OpenClash 支持 [YAML] 覆写块，Mihomo 支持 MRS Rule Provider
# Action: 添加两个远程 Rule Provider，并将对应的 DIRECT 规则插入现有 rules 顶部
# Conflicts: 本模块规则会优先于原有规则，命中目标将强制直连
# Verification: 在最终运行配置中检查两个 Provider 与两条前置 DIRECT 规则
#
# 功能：
# 1. 引用本项目的 Custom_Direct_Domain.mrs 域名直连规则
# 2. 引用本项目的 Custom_Direct_IP.mrs IP 直连规则
# 3. 为 IP Rule Provider 的引用规则启用 no-resolve
# 4. 保留用户原有 rules 与 rule-providers，不整体替换现有配置
#
# 限制：
# - 仅附加本项目的域名与 IP 直连规则，不引入端口规则或其他项目配置
# - 两条规则插入 rules 顶部，可能覆盖用户原有的代理或拒绝规则
# - 规则文件通过 cdn.jsdelivr.net 下载，网络不可达时 Provider 无法更新
# - 域名规则每 30 分钟检查一次更新，IP 规则每 24 小时检查一次更新

rule-providers:
  COCR-Custom-Direct-Domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs
    path: ./rule_provider/COCR_Custom_Direct_Domain.mrs
    interval: 1800

  COCR-Custom-Direct-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs
    path: ./rule_provider/COCR_Custom_Direct_IP.mrs
    interval: 86400

+rules:
  - RULE-SET,COCR-Custom-Direct-Domain,DIRECT
  - RULE-SET,COCR-Custom-Direct-IP,DIRECT,no-resolve
