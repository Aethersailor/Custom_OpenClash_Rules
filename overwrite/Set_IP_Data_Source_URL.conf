#!NAME = Set_IP_Data_Source_URL.conf
#!DESC = 将 GeoIP、GeoASN 及大陆 IPv4、IPv6 白名单数据源统一设为 Aethersailor/geoip
#!CONFIG = all
#!CRON = off

[General]
# Author: Aethersailor
# Project: Custom_OpenClash_Rules
# Compatibility: 需 OpenClash 支持覆写模块的 GEO_CUSTOM_URL、GEOIP_CUSTOM_URL、GEOASN_CUSTOM_URL、CHNR_CUSTOM_URL 与 CHNR6_CUSTOM_URL 参数
# Action: 覆写 OpenClash 的 IP 数据下载地址，由插件写入 geox-url 并生成大陆白名单数据
# Conflicts: 会覆盖已有的对应数据源地址；已包含另外两个数据源替换模块的功能，无需重复启用
# Verification: 检查最终运行配置的 geox-url 中的 mmdb、geoip、asn 地址，以及大陆白名单更新日志
#
# 功能：
# 1. 将 GEOIP MMDB 数据库地址替换为 Aethersailor/geoip 的 Country.mmdb
# 2. 将 GEOIP DAT 数据库地址替换为 Aethersailor/geoip 的 geoip.dat
# 3. 将 GeoASN 数据库地址替换为 Aethersailor/geoip 的 Country-asn.mmdb
# 4. 将大陆 IPv4 白名单数据源替换为 Aethersailor/geoip 的 cn-ipv4.txt
# 5. 将大陆 IPv6 白名单数据源替换为 Aethersailor/geoip 的 cn-ipv6.txt
# 6. 同时作用于 OpenClash 启动时的数据检查、运行配置生成和插件自身的数据更新流程
#
# 限制：
# - 不会自动启用 GEOIP DAT 模式
# - 不会自动开启“绕过中国大陆 IP”或“回国”模式
# - 不会自动启用数据库或大陆白名单的定时更新
# - 不修改 GeoSite、规则、策略组或 Rule Provider 数据源
# - 只有相关大陆 IP 白名单功能已经启用时，白名单数据源才会被实际使用
# - 大陆白名单数据源必须保持为每行一个合法 CIDR 的纯文本格式

GEO_CUSTOM_URL = https://cdn.jsdelivr.net/gh/Aethersailor/geoip@release/Country.mmdb
GEOIP_CUSTOM_URL = https://cdn.jsdelivr.net/gh/Aethersailor/geoip@release/geoip.dat
GEOASN_CUSTOM_URL = https://cdn.jsdelivr.net/gh/Aethersailor/geoip@release/Country-asn.mmdb
CHNR_CUSTOM_URL = https://cdn.jsdelivr.net/gh/Aethersailor/geoip@release/text/cn-ipv4.txt
CHNR6_CUSTOM_URL = https://cdn.jsdelivr.net/gh/Aethersailor/geoip@release/text/cn-ipv6.txt
