[General]
# Name: Prevent DNS Leak
# Author: Aethersailor
# Project: Custom_OpenClash_Rules
# Description: 通过 DNS 劫持、规则跟随、no-resolve 与代理兜底降低 DNS 泄露风险
# Compatibility: 需 OpenClash 支持 [General]、[Overwrite] 与 ruby_edit，Mihomo 支持 respect-rules
# Action: 强制规则模式并改写最终 DNS、规则和代理组配置
# Conflicts: 会强制启用路由器自身代理和 DNS 劫持，并将最终 MATCH 改为代理策略
# Verification: 检查最终运行配置中的 dns.respect-rules、proxy-server-nameserver、no-resolve 与 MATCH
#
# 功能：
# 1. 强制使用 rule 模式，并启用路由器自身代理
# 2. 启用 OpenClash DNS 劫持，拦截客户端和路由器自身的 TCP/UDP 53 端口查询
# 3. 启用 dns.respect-rules，使 DNS 上游连接遵循分流规则
# 4. 禁止 OpenClash 自动追加 WAN DNS 和自动补充 default-nameserver
# 5. 为目标 IP 类规则以及 behavior: ipcidr 的 RULE-SET 添加 no-resolve
# 6. 将最终 MATCH/FINAL 改为 COCR-DNS-Leak-Guard 专用策略组
# 7. 专用策略组自动引入全部代理节点和代理集合，且为空时回退 REJECT
# 8. 清除 DNS 列表中的 system 解析器，并关闭 DNS HTTP/3 偏好
#
# 限制：
# - 不会替用户选择或更换具体 DNS 上游；建议使用可靠的加密 DNS
# - 缺少 proxy-server-nameserver 时，会尝试复用 default-nameserver
# - 如 default-nameserver 使用普通 UDP/TCP DNS，代理节点域名的引导解析仍可能被观察
# - 不处理 AND、OR、NOT 等逻辑规则内部嵌套的 IP 规则
# - 不阻断客户端自带的 DoH、DoT 或 DoQ；建议同时启用 Block_Encrypted_DNS.conf
# - IPv6 已在局域网启用但未被 OpenClash 接管时，仍需单独处理 IPv6 DNS 泄露

PROXY_MODE = rule
ROUTER_SELF_PROXY = 1
ENABLE_REDIRECT_DNS = 1
ENABLE_RESPECT_RULES = 1
APPEND_WAN_DNS = 0
APPEND_DEFAULT_DNS = 0

[Overwrite]
ruby_edit "$CONFIG_FILE" "['rules']" "(Value['dns'].is_a?(Hash) ? Value['dns'] : {}).tap { |dns| Value['dns'] = dns }.tap { |dns| dns['enable'] = true }.tap { |dns| dns['respect-rules'] = true }.tap { |dns| dns['prefer-h3'] = false }.tap { |dns| ['nameserver', 'fallback', 'default-nameserver', 'proxy-server-nameserver', 'direct-nameserver'].each { |key| dns[key] = dns[key].reject { |server| server.to_s.strip.downcase == 'sys' + 'tem' || server.to_s.strip.downcase.start_with?('sys' + 'tem://') } if dns[key].is_a?(Array) } }.tap { |dns| dns['proxy-server-nameserver'] = dns['default-nameserver'].to_a.map { |server| server.to_s.strip }.reject { |server| server.empty? || server.downcase == 'sys' + 'tem' || server.downcase.start_with?('sys' + 'tem://') }.uniq unless dns['proxy-server-nameserver'].is_a?(Array) && dns['proxy-server-nameserver'].any? }.tap { |dns| YAML.LOG_WARN('Prevent DNS Leak: proxy-server-nameserver is empty, configure an IP-based default-nameserver') if dns['proxy-server-nameserver'].to_a.empty? }.then { |dns| (lambda { |rule_list| rule_list.is_a?(Array) ? rule_list.map { |rule| rule.is_a?(String) ? rule.split(',').map(&:strip).then { |parts| parts.length >= 3 && !parts.drop(3).map(&:downcase).include?('no-resolve') && !parts.drop(3).map(&:downcase).include?('src') && (['IP-CIDR', 'IP-CIDR6', 'GEOIP'].include?(parts[0].to_s.upcase) || (parts[0].to_s.upcase == 'RULE-SET' && (Value['rule-providers'] || {})[parts[1].to_s].then { |provider| provider.is_a?(Hash) && provider['behavior'].to_s.strip.downcase == 'ipcidr' })) ? parts.insert(3, 'no-resolve').join(',') : rule } : rule } : rule_list }).tap { |add_no_resolve| Value['sub-rules'].transform_values! { |rule_list| add_no_resolve.call(rule_list) } if Value['sub-rules'].is_a?(Hash) }.then { |add_no_resolve| (Value['proxy-groups'].is_a?(Array) ? Value['proxy-groups'] : []).tap { |groups| Value['proxy-groups'] = groups }.tap { |groups| groups.reject! { |group| group.is_a?(Hash) && group['name'].to_s == 'COCR-DNS-Leak-Guard' } }.tap { |groups| groups << {'name' => 'COCR-DNS-Leak-Guard', 'type' => 'select', 'include-all' => true, 'exclude-type' => 'Direct', 'empty-fallback' => 'REJECT'} }.then { |groups| (Value['rules'].is_a?(Array) ? add_no_resolve.call(Value['rules']) : []).map { |rule| rule.is_a?(String) && ['MATCH', 'FINAL'].include?(rule.split(',', 2)[0].to_s.strip.upcase) ? 'MATCH,COCR-DNS-Leak-Guard' : rule }.then { |rules| rules.any? { |rule| rule.is_a?(String) && rule.split(',', 2)[0].to_s.strip.upcase == 'MATCH' } ? rules.uniq : (rules + ['MATCH,COCR-DNS-Leak-Guard']).uniq } } } }"
