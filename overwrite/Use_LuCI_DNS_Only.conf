[Overwrite]
# Name: Use LuCI DNS Only
# Author: Aethersailor
# Project: Custom_OpenClash_Rules
# Description: 原子重建最终 DNS 配置，移除机场 YAML 对 DNS、Hosts 与 Fake-IP DNS 字段的影响
# Compatibility: 依赖 OpenClash 当前 yml_change.sh 生成的 /tmp/yaml_config.* 片段及 ruby_edit 执行环境
# Action: 从 LuCI/UCI 生成片段和 OpenClash 自定义文件重建 dns 与顶层 hosts，不修改其他配置
# Conflicts: 必须作为最后执行的 DNS 覆写；不得与其他修改 dns 或 hosts 的覆写模块同时使用
# Verification: 必须检查最终运行 YAML，并使用当前 Mihomo 核心加载该文件；订阅下载成功不能证明生效
#
# 硬性前置条件：
# 1. 已在「覆写设置」→「DNS 设置」启用「自定义上游 DNS 服务器」
# 2. LuCI 中至少有一个已启用且分组为 nameserver 的 DNS 服务器
# 3. Fake-IP 模式下，必须在 LuCI 明确设置 Fake-IP IPv4 范围，不能保留 0（从机场 YAML 读取）
# 4. Fake-IP 模式同时启用大陆 IPv4/IPv6 绕过时，必须启用自定义 Fake-IP-Filter 并明确选择模式
# 5. 启用 respect-rules、代理节点 DNS 策略或为全部 nameserver 指定代理组时，必须在 LuCI 明确配置至少一个不经代理组转发的 proxy-server-nameserver
#
# 功能：
# 1. nameserver、fallback、default-nameserver、proxy-server-nameserver 与 direct-nameserver 只读取本次启动由 LuCI 生成的临时片段
# 2. 未在 LuCI 配置 fallback、默认 DNS、代理节点 DNS 或直连 DNS 时，从最终 dns 中删除对应机场键
# 3. nameserver-policy、proxy-server-nameserver-policy、fallback-filter、Fake-IP-Filter 与 Hosts 只读取已启用的 OpenClash 自定义文件
# 4. 保留 yml_change.sh 已根据 LuCI 生成的 enable、ipv6、enhanced-mode、listen 与 respect-rules
# 5. 保留 OpenClash 根据路由器主机名生成的内置 Hosts；删除机场 YAML 的顶层 hosts
# 6. 只替换 dns 与顶层 hosts，保留节点、代理集合、策略组、规则、Rule Provider 和其他非 DNS 配置
#
# 限制：
# - 模块依赖 OpenClash 内部临时文件名与 UCI 结构；升级 OpenClash 后必须重新核对源码和最终运行配置
# - 前置条件不满足时，模块记录错误并拒绝重建；此时原运行配置保持不变，不能视为机场 DNS 已被隔离
# - 本模块不设置任何 DNS 上游，也不提供通用默认 DNS
# - 使用域名形式的加密 DNS 时，仍需在 LuCI 配置可用的 default-nameserver，最终以 Mihomo 核心加载结果为准
# - 其他更晚执行的模块或 /etc/openclash/custom/openclash_custom_overwrite.sh 仍可再次修改 dns 或 hosts

ruby_edit "$CONFIG_FILE" "['dns']" "begin; uci_get = lambda { |key, default_value| value = %x{uci -q get openclash.@overwrite[0].#{key} 2>/dev/null || uci -q get openclash.config.#{key} 2>/dev/null}.strip; value.empty? ? default_value : value }; load_yaml = lambda { |path| begin; File.exist?(path) ? YAML.load_file(path) : nil; rescue Exception; nil; end }; list_from = lambda { |path, key| data = load_yaml.call(path); data.is_a?(Hash) && data[key].is_a?(Array) ? data[key].map { |item| item.to_s }.reject(&:empty?).uniq : [] }; redirect_dns = uci_get.call('enable_redirect_dns', '1') == '1'; clean_list = lambda { |items| values = items.to_a.map { |item| item.to_s }.reject(&:empty?); redirect_dns ? values.reject { |item| item.match?(/^system($|:\/\/)/) }.uniq : values.uniq }; clean_policy = lambda { |policy| result = policy.is_a?(Hash) ? Marshal.load(Marshal.dump(policy)) : {}; if redirect_dns; result.keys.each { |key| value = result[key]; if value.is_a?(Array); value = value.map { |item| item.to_s }.reject { |item| item.match?(/^system($|:\/\/)/) }.uniq; value.empty? ? result.delete(key) : result[key] = value; elsif value.to_s.match?(/^system($|:\/\/)/); result.delete(key); end }; end; result }; current_dns = Value['dns'].is_a?(Hash) ? Value['dns'] : {}; nameservers = clean_list.call(list_from.call('/tmp/yaml_config.namedns.yaml', 'nameserver')); fallback = clean_list.call(list_from.call('/tmp/yaml_config.falldns.yaml', 'fallback')); default_nameservers = clean_list.call(list_from.call('/tmp/yaml_config.defaultdns.yaml', 'default-nameserver')); proxy_nameservers = clean_list.call(list_from.call('/tmp/yaml_config.proxynamedns.yaml', 'proxy-server-nameserver')); direct_nameservers = clean_list.call(list_from.call('/tmp/yaml_config.directnamedns.yaml', 'direct-nameserver')); append_default = uci_get.call('append_default_dns', '0') == '1'; if append_default; domain_server = /^dhcp:\/\/|^system($|:\/\/)|([0-9a-zA-Z-]{1,}\.)+([a-zA-Z]{2,})/; derived_defaults = (nameservers | fallback).reject { |server| server.match?(domain_server) }; default_nameservers = (default_nameservers + derived_defaults).uniq; end; name_policy_data = load_yaml.call('/etc/openclash/custom/openclash_custom_domain_dns_policy.list'); name_policy = uci_get.call('custom_name_policy', '0') == '1' ? clean_policy.call(name_policy_data) : {}; proxy_policy_data = load_yaml.call('/etc/openclash/custom/openclash_custom_proxy_server_dns_policy.list'); proxy_policy = uci_get.call('custom_proxy_server_policy', '0') == '1' ? clean_policy.call(proxy_policy_data) : {}; local_exclude = ((Dir.children('/sys/class/net') rescue []) + ['h3=', 'skip-cert-verify=', 'ecs=', 'ecs-override=', 'disable-ipv6=', 'disable-ipv4=', 'disable-qtype-', 'disable-reuse=', 'utun', 'tailscale0', 'docker0', 'tun163', 'br-lan', 'mihomo']).uniq.map { |item| Regexp.escape(item) }.join('|'); proxied_server = /^[^#&]+#(?:(?:#{local_exclude})[^&]*&)*(?:(?!(?:#{local_exclude}))[^&]+)/; errors = []; errors << 'Custom DNS Setting is disabled' unless uci_get.call('enable_custom_dns', '0') == '1'; errors << 'LuCI nameserver is empty' if nameservers.empty?; fake_mode = current_dns['enhanced-mode'].to_s == 'fake-ip'; fake_range = uci_get.call('fakeip_range', '0'); errors << 'Fake-IP Range must be set explicitly in LuCI' if fake_mode && (fake_range.empty? || fake_range == '0'); china_bypass = uci_get.call('china_ip_route', '0') != '0' || uci_get.call('china_ip6_route', '0') != '0'; custom_fake_filter = uci_get.call('custom_fakeip_filter', '0') == '1'; errors << 'China bypass in Fake-IP mode requires Custom Fake-IP-Filter' if fake_mode && china_bypass && !custom_fake_filter; routed_nameservers = !nameservers.empty? && nameservers.all? { |server| server.match?(proxied_server) }; proxy_required = current_dns['respect-rules'] == true || routed_nameservers || !proxy_policy.empty?; errors << 'proxy-server-nameserver must be set explicitly in LuCI' if proxy_required && proxy_nameservers.empty?; errors << 'proxy-server-nameserver needs at least one ungrouped server' if !proxy_nameservers.empty? && proxy_nameservers.all? { |server| server.match?(proxied_server) }; if errors.any?; YAML.LOG_ERROR('Use LuCI DNS Only refused: %s' % [errors.join('; ')]); current_dns; else; rebuilt = {}; ['enable', 'ipv6', 'enhanced-mode', 'listen', 'respect-rules'].each { |key| rebuilt[key] = current_dns[key] if current_dns.key?(key) }; rebuilt['nameserver'] = nameservers; rebuilt['fallback'] = fallback unless fallback.empty?; rebuilt['default-nameserver'] = default_nameservers unless default_nameservers.empty?; rebuilt['proxy-server-nameserver'] = proxy_nameservers unless proxy_nameservers.empty?; rebuilt['direct-nameserver'] = direct_nameservers unless direct_nameservers.empty?; rebuilt['nameserver-policy'] = name_policy unless name_policy.empty?; rebuilt['proxy-server-nameserver-policy'] = proxy_policy unless proxy_policy.empty?; if uci_get.call('custom_fallback_filter', '0') == '1' && !fallback.empty?; fallback_filter_data = load_yaml.call('/etc/openclash/custom/openclash_custom_fallback_filter.yaml'); fallback_filter = fallback_filter_data.is_a?(Hash) ? fallback_filter_data['fallback-filter'] : nil; rebuilt['fallback-filter'] = fallback_filter if fallback_filter.is_a?(Hash); end; if fake_mode; rebuilt['fake-ip-range'] = fake_range; fake_range6 = uci_get.call('fakeip_range6', '0'); rebuilt['fake-ip-range6'] = fake_range6 if rebuilt['ipv6'] == true && !fake_range6.empty? && fake_range6 != '0'; if custom_fake_filter; filter_mode = uci_get.call('custom_fakeip_filter_mode', 'blacklist'); rebuilt['fake-ip-filter-mode'] = filter_mode; filter_files = ['/etc/openclash/custom/openclash_custom_fake_filter.list', '/tmp/yaml_openclash_fake_filter_include']; filters = filter_files.flat_map { |path| File.exist?(path) ? File.readlines(path).map { |line| line.gsub(/#.*$/, '').strip }.reject(&:empty?) : [] }; rebuilt['fake-ip-filter'] = filters.uniq unless filters.empty?; end; if china_bypass; filter_mode = rebuilt['fake-ip-filter-mode']; filters = rebuilt['fake-ip-filter'].to_a; if filter_mode == 'blacklist' || filter_mode.nil?; filters << 'rule-set:oc-cn-domain'; elsif filter_mode == 'whitelist'; filters.reject! { |filter| filter =~ /(geosite:?|rule-set:?).*(@cn|:cn|,cn|:china)/i }; elsif filter_mode == 'rule'; filters.unshift('RULE-SET,oc-cn-domain,real-ip'); end; rebuilt['fake-ip-filter'] = filters.uniq unless filters.empty?; end; end; hosts = {}; if uci_get.call('custom_host', '0') == '1'; hosts_data = load_yaml.call('/etc/openclash/custom/openclash_custom_hosts.list'); custom_hosts = hosts_data.is_a?(Hash) && hosts_data['hosts'].is_a?(Hash) ? hosts_data['hosts'] : hosts_data; hosts.merge!(custom_hosts) if custom_hosts.is_a?(Hash); end; {'openwrt.lan' => 'lan', 'immortalwrt.lan' => 'lan', 'lede.lan' => 'lan', 'router.lan' => 'lan'}.each { |key, value| hosts[key] ||= value }; system_hostname = %x{uci -q get system.@system[0].hostname 2>/dev/null}.strip; dnsmasq_domain = %x{uci -q get dhcp.@dnsmasq[0].domain 2>/dev/null}.strip; hosts[system_hostname + '.lan'] ||= 'lan' unless system_hostname.empty?; hosts[system_hostname + '.' + dnsmasq_domain] ||= 'lan' unless system_hostname.empty? || dnsmasq_domain.empty?; Value['hosts'] = hosts; rebuilt['use-hosts'] = true; YAML.LOG_TIP('Use LuCI DNS Only rebuilt DNS from OpenClash settings: nameserver=%d, fallback=%d' % [nameservers.length, fallback.length]); rebuilt; end; end"
