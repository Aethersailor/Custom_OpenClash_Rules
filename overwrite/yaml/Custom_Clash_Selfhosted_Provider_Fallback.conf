[General]
# Custom_OpenClash_Rules
# OpenClash 远程 YAML 覆写模块（自建节点 Provider 优先 + 机场故障转移版）
# 对应配置：cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml
# 模块变量：EN_KEY1=机场订阅链接;EN_KEY2=自建节点订阅链接
# EN_KEY2 应为 Mihomo 可识别且可通过 HTTP 获取的节点订阅地址。

DOWNLOAD_FILE = url=https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@refs/heads/main/cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml, path=/etc/openclash/config/Custom_Clash_Selfhosted_Provider_Fallback.yaml, force=true
CONFIG_FILE = /etc/openclash/config/Custom_Clash_Selfhosted_Provider_Fallback.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "provider1" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "selfhost" "['url']" "$EN_KEY2"
