#!NAME = Custom_Clash_Lite.conf
#!DESC = 下载并切换至 Custom_OpenClash_Rules 的轻量版 YAML 配置
#!CONFIG = all
#!CRON = off
#!ENV = EN_KEY1

[General]
# Custom_OpenClash_Rules
# OpenClash 远程 YAML 覆写模块（轻量版）
# 对应配置：cfg/yaml/Custom_Clash_Lite.yaml
# 模块变量：EN_KEY1=节点订阅链接

DOWNLOAD_FILE = url=https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/cfg/yaml/Custom_Clash_Lite.yaml, path=/etc/openclash/config/Custom_Clash_Lite.yaml, force=true
CONFIG_FILE = /etc/openclash/config/Custom_Clash_Lite.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "provider1" "['url']" "$EN_KEY1"
