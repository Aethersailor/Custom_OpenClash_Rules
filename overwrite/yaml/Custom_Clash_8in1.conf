[General]
# Custom_OpenClash_Rules
# OpenClash 远程 YAML 覆写模块（8 合 1）
# 本模块覆盖以下 8 个正式 YAML 配置，不包含自建节点版本和完整示例模板。
#
# 模块变量：
# EN_KEY1=节点订阅链接
# EN_KEY2=配置名称（不含 .yaml）；留空时默认使用 Custom_Clash
#
# EN_KEY2 仅允许填写以下值之一：
# Custom_Clash
# Custom_Clash_Fallback
# Custom_Clash_Lite
# Custom_Clash_Lite_Fallback
# Custom_Clash_GFW
# Custom_Clash_GFW_Fallback
# Custom_Clash_Full
# Custom_Clash_Full_Fallback
#
# 参数示例：
# EN_KEY1=https://example.com/subscription;EN_KEY2=Custom_Clash_Lite_Fallback

DOWNLOAD_FILE = url=https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@refs/heads/main/cfg/yaml/${EN_KEY2:-Custom_Clash}.yaml, path=/etc/openclash/config/${EN_KEY2:-Custom_Clash}.yaml, force=true
CONFIG_FILE = /etc/openclash/config/${EN_KEY2:-Custom_Clash}.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "provider1" "['url']" "$EN_KEY1"
