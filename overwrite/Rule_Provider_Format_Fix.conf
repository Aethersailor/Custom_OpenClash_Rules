[Overwrite]
# Name: Rule Provider Format Fix
# Author: Aethersailor
# Project: Custom_OpenClash_Rules
# Description: 根据 Rule Provider 的 URL 或 path 扩展名补全或修正 format
# Compatibility: 需 OpenClash 支持 [Overwrite] 与 ruby_edit，Mihomo 支持 rule-providers.format
# Action: 遍历顶层 rule-providers，并根据 .mrs、.yaml 或 .yml 后缀写入对应 format
# Conflicts: 识别到受支持扩展名时会覆盖与扩展名不一致的现有 format
# Verification: 在最终运行配置中检查目标 Rule Provider 的 format 是否与文件扩展名一致
#
# 功能：
# 1. 普通远程 Provider 优先根据 url 后缀判断，再回退检查 path
# 2. type: file 优先根据 path 后缀判断，再回退检查 url
# 3. .mrs 设置为 format: mrs
# 4. .yaml 或 .yml 设置为 format: yaml
# 5. 忽略 URL 查询参数和片段，扩展名匹配不区分大小写
# 6. 未识别到受支持扩展名时保持原配置不变
#
# 限制：
# - 只处理顶层 rule-providers
# - 只识别 .mrs、.yaml 和 .yml
# - 不修改 type、behavior、url 或 path
# - 不下载或校验 Rule Provider 的实际文件内容
# - 如果文件扩展名与实际内容不一致，仍会按照扩展名设置 format

ruby_edit "$CONFIG_FILE" "; providers=Value['rule-providers']; if providers.is_a?(Hash); providers.each_value do |provider|; next unless provider.is_a?(Hash); candidates=provider['type'].to_s=='file' ? [provider['path'],provider['url']] : [provider['url'],provider['path']]; source=candidates.compact.map{|item| item.to_s.split(/[?#]/,2).first.downcase}.find{|item| item.end_with?('.mrs') || item.end_with?('.yaml') || item.end_with?('.yml')}.to_s; if source.end_with?('.mrs'); provider['format']='mrs'; elsif source.end_with?('.yaml') || source.end_with?('.yml'); provider['format']='yaml'; end; end; end; _openclash_rule_provider_format_fix" "nil"
