# Custom_OpenClash_Rules
# OpenClash 专用最小 YAML 配置文件（手工自建节点优先 + 机场故障转移版）
# 项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
# 本文件仅定义节点来源、手工填写的静态节点、策略组、规则提供者与分流规则。
# 端口、运行模式、DNS、IPv6、TUN、嗅探、GeoData、日志及控制器等参数全部由 OpenClash LuCI 管理。
# 建议先按照项目 Wiki 完成 OpenClash 设置，再加载本配置。
# 手工填写的固定自建节点作为主要代理出口，provider1 机场订阅作为后备。
# 如需通过节点订阅或转换后的节点链接加载自建节点，请使用 Custom_Clash_Selfhosted_Provider_Fallback.yaml。
# fallback 仅检测连通性，无法判断流媒体或 AI 服务的地区解锁能力。

# ==================== 代理提供者 Proxy Providers ====================
# provider1 用于加载机场订阅；多订阅用户可复制并依次命名为 provider2、provider3……
# 新增 Provider 后，还需将其加入相关策略组的 use 列表。
proxy-providers:
  provider1:
    type: http
    url: "url"  # 填入订阅链接
    interval: 3600  # 订阅更新间隔，单位：秒
    path: ./proxy_provider/provider1.yaml
    proxy: DIRECT  # 下载订阅时使用的策略
    # 在 Provider 层统一排除公告、流量、到期等非节点条目，避免各策略组重复配置
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      # 不建议默认跳过 TLS 证书校验；仅在明确需要兼容特定节点时启用
      # skip-cert-verify: true
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"

# ==================== 自建节点 Proxies ====================
# 使用前必须替换 server、port、uuid、servername、public-key 和 short-id。
# 当前示例参数不对应任何真实服务器；未修改时该节点不可用，fallback 将自动回落机场。
proxies:
  - name: "🏴‍☠️ 自建节点 01"
    type: vless
    server: selfhost.example.com  # 必须替换为自建服务器地址
    port: 443 # 按服务端实际端口修改
    uuid: "00000000-0000-0000-0000-000000000000" # 必须替换为真实 UUID
    udp: true
    flow: xtls-rprx-vision
    packet-encoding: xudp
    tls: true
    servername: example.com  # 必须与 Reality 服务端配置一致
    client-fingerprint: chrome
    skip-cert-verify: false
    reality-opts:
      public-key: "Om7RMGbRUZjtJ9a3caJYod2dVYo-WfJNV5-C_QlvPmw"  # 示例占位值，必须替换
      short-id: "0123456789abcdef" # 示例占位值，必须替换
    encryption: ""
    network: tcp

# ==================== 代理策略组 Proxy Groups ====================
# 基于标准故障转移版的策略组结构；代理型 fallback 统一优先使用自建节点，机场分组保持原顺序后备。
# provider1 仅承载机场订阅；公共节点过滤继续在 Provider 层统一完成。
# fallback 组显式配置健康检查参数，并按候选顺序选择首个可用项。
proxy-groups:
  - name: "🚀 故障转移"
    type: fallback
    proxies:
      - "🏴‍☠️ 自建节点"
