; 此文件由 py/generate_stash_configs.py 生成，请勿直接修改。
; 策略来源：cfg/Custom_Clash_Full.ini
; Stash 兼容边界：非国家 GEOIP 已映射为 MRS；SRC-PORT,41641 因仅网关 SCRIPT
; 可实现而被显式排除；策略组仅保留 interval，不输出无等价语义的组级 URL、
; timeout 与 tolerance；复杂排除正则使用可移植的全节点回退或已有自动组。
;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

;本模板为 Full 模板，可以自由添加规则和分组，无性能考量，较为臃肿

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs,28800|no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,28800
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs,28800|no-resolve
ruleset=🎯 全球直连,[]DST-PORT,7844
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
