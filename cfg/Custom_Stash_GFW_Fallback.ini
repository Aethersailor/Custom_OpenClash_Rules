; 此文件由 py/generate_stash_configs.py 生成，请勿直接修改。
; 策略来源：cfg/Custom_Clash_GFW_Fallback.ini
; Stash 兼容边界：非国家 GEOIP 已映射为 MRS；SRC-PORT,41641 因仅网关 SCRIPT
; 可实现而被显式排除；策略组仅保留 interval，不输出无等价语义的组级 URL、
; timeout 与 tolerance；复杂排除正则使用可移植的全节点回退或已有自动组。
;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果
ruleset=🚀 故障转移,[]GEOSITE,gfw
ruleset=🚀 故障转移,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs,28800|no-resolve
ruleset=🚀 故障转移,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/facebook.mrs,28800|no-resolve
ruleset=🚀 故障转移,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/twitter.mrs,28800|no-resolve
ruleset=🎯 全球直连,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
custom_proxy_group=🚀 故障转移`fallback`.*``300
custom_proxy_group=🎯 全球直连`select`[]DIRECT
;设置分组标志位结束

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
