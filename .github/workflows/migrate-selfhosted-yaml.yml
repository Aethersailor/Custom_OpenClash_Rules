name: Migrate self-hosted YAML templates

on:
  issues:
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: main-writers

jobs:
  migrate:
    if: github.event.issue.title == 'COCR_INTERNAL_MIGRATE_SELFHOSTED_YAML'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate paired self-hosted templates
        run: |
          python - <<'PY'
          from pathlib import Path

          yaml_dir = Path('cfg/yaml')
          source_path = yaml_dir / 'Custom_Clash_Selfhosted_Fallback.yaml'
          manual_path = yaml_dir / 'Custom_Clash_Selfhosted_Manual_Fallback.yaml'
          provider_path = yaml_dir / 'Custom_Clash_Selfhosted_Provider_Fallback.yaml'
          readme_path = Path('cfg/README.md')

          source = source_path.read_text(encoding='utf-8')

          manual = source.replace(
              '# OpenClash 专用最小 YAML 配置文件（自建节点优先 + 机场故障转移版）',
              '# OpenClash 专用最小 YAML 配置文件（手工自建节点优先 + 机场故障转移版）',
              1,
          )
          manual = manual.replace(
              '# 本文件仅定义节点来源、静态节点、策略组、规则提供者与分流规则。',
              '# 本文件仅定义节点来源、手工填写的静态节点、策略组、规则提供者与分流规则。',
              1,
          )
          manual = manual.replace(
              '# 固定自建节点作为主要代理出口，provider1 机场订阅作为后备。',
              '# 手工填写的固定自建节点作为主要代理出口，provider1 机场订阅作为后备。\n'
              '# 如需通过节点订阅或转换后的节点链接加载自建节点，请使用 Custom_Clash_Selfhosted_Provider_Fallback.yaml。',
              1,
          )
          manual_path.write_text(manual, encoding='utf-8', newline='\n')

          provider = source.replace(
              '# OpenClash 专用最小 YAML 配置文件（自建节点优先 + 机场故障转移版）',
              '# OpenClash 专用最小 YAML 配置文件（自建节点 Provider 优先 + 机场故障转移版）',
              1,
          )
          provider = provider.replace(
              '# 本文件仅定义节点来源、静态节点、策略组、规则提供者与分流规则。',
              '# 本文件仅定义节点来源、策略组、规则提供者与分流规则。',
              1,
          )
          provider = provider.replace(
              '# 固定自建节点作为主要代理出口，provider1 机场订阅作为后备。',
              '# selfhost Provider 中的自建节点作为主要代理出口，provider1 机场订阅作为后备。\n'
              '# selfhost.url 必须指向 Mihomo 可识别的 HTTP 节点订阅；支持 YAML、URI 列表或 Base64 内容。\n'
              '# 单条节点链接需先转换为可通过 HTTP 获取的订阅地址，再由覆写模块写入 selfhost.url。',
              1,
          )

          static_start = provider.index('# ==================== 自建节点 Proxies ====================')
          groups_start = provider.index('# ==================== 代理策略组 Proxy Groups ====================')
          provider = provider[:static_start] + provider[groups_start:]

          provider = provider.replace(
              '# provider1 用于加载机场订阅；多订阅用户可复制并依次命名为 provider2、provider3……\n'
              '# 新增 Provider 后，还需将其加入相关策略组的 use 列表。',
              '# provider1 用于加载机场订阅，selfhost 用于加载自建节点订阅。\n'
              '# 多机场订阅用户可复制 provider1 并依次命名为 provider2、provider3……\n'
              '# 新增 Provider 后，还需将其加入相关策略组的 use 列表。',
              1,
          )

          selfhost_provider = (
              '  selfhost:\n'
              '    type: http\n'
              '    url: "url"  # 填入自建节点订阅地址，或单条节点链接经转换后得到的订阅地址\n'
              '    interval: 3600  # 订阅更新间隔，单位：秒\n'
              '    path: ./proxy_provider/selfhost.yaml\n'
              '    proxy: DIRECT  # 下载订阅时使用的策略\n'
              '    # 为自建节点统一添加前缀，降低与机场节点重名的概率\n'
              '    override:\n'
              '      additional-prefix: "🏴‍☠️ "\n\n'
          )
          marker = '# ==================== 代理策略组 Proxy Groups ===================='
          provider = provider.replace('\n' + marker, '\n' + selfhost_provider + marker, 1)

          provider = provider.replace(
              '# 基于标准故障转移版的策略组结构；代理型 fallback 统一优先使用自建节点，机场分组保持原顺序后备。\n'
              '# provider1 仅承载机场订阅；公共节点过滤继续在 Provider 层统一完成。',
              '# 基于标准故障转移版的策略组结构；代理型 fallback 统一优先使用自建节点，机场分组保持原顺序后备。\n'
              '# selfhost 仅承载自建节点，provider1 仅承载机场订阅；公共机场节点过滤继续在 provider1 层统一完成。',
              1,
          )

          old_group = (
              '  - name: "🏴‍☠️ 自建节点"\n'
              '    type: url-test\n'
              '    proxies:\n'
              '      - "🏴‍☠️ 自建节点 01"\n'
          )
          new_group = (
              '  - name: "🏴‍☠️ 自建节点"\n'
              '    type: url-test\n'
              '    use:\n'
              '      - selfhost\n'
          )
          if old_group not in provider:
              raise RuntimeError('self-hosted proxy group block not found')
          provider = provider.replace(old_group, new_group, 1)
          provider_path.write_text(provider, encoding='utf-8', newline='\n')

          readme = readme_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '- [`yaml/`](./yaml) 目录中的 `.yaml` 文件是 **可供 Mihomo / OpenClash 使用的完整配置文件**，通过 `proxy-providers` 加载订阅节点。',
                  '- [`yaml/`](./yaml) 目录中的 `.yaml` 文件是 **面向 OpenClash 的最小配置文件**，仅保留节点来源、策略组、规则提供者与分流规则；运行参数由 OpenClash LuCI 管理。',
              ),
              (
                  '[`yaml/`](./yaml) 目录提供与上述 8 个 `.ini` 模板对应的完整 YAML 配置：',
                  '[`yaml/`](./yaml) 目录提供与上述 8 个 `.ini` 模板对应的 OpenClash 专用最小 YAML 配置：',
              ),
              (
                  '此外，`yaml/` 目录中还包含独立的 [`Custom_Clash_DIY&Airport.yaml`](./yaml/Custom_Clash_DIY&Airport.yaml)。该文件用于“自建节点优先、机场节点故障转移”的特定场景，不属于上述 8 个相互对应的常规版本。',
                  '此外，`yaml/` 目录还提供两份“自建节点优先、机场节点故障转移”配置：\n\n'
                  '- [`Custom_Clash_Selfhosted_Manual_Fallback.yaml`](./yaml/Custom_Clash_Selfhosted_Manual_Fallback.yaml)：直接在 YAML 或覆写模块中填写静态节点参数。\n'
                  '- [`Custom_Clash_Selfhosted_Provider_Fallback.yaml`](./yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml)：通过独立 `selfhost` Proxy Provider 加载自建节点订阅。\n\n'
                  '这两份配置不对应根目录中的 `.ini` 模板。',
              ),
              (
                  'YAML 配置文件不需要经过订阅转换。文件中已经包含策略组、规则、DNS、嗅探、GeoData 和常用运行参数，并通过 `proxy-providers` 加载节点订阅。',
                  'YAML 配置文件不需要经过订阅转换。文件中仅保留节点来源、策略组、规则提供者和分流规则；端口、DNS、IPv6、TUN、嗅探、GeoData、日志及控制器等运行参数由 OpenClash LuCI 生成。',
              ),
              (
                  '- 可以直接检查和维护完整配置结构\n- 包含较完整的 Mihomo 运行参数\n- 部分端口、DNS、TUN 和运行参数可能被 OpenClash 设置覆写',
                  '- 配置结构精简，不预设 OpenClash LuCI 管理的运行参数\n'
                  '- OpenClash LuCI 是端口、DNS、IPv6、TUN、嗅探等运行参数的唯一配置入口\n'
                  '- 规则、策略组与 Provider 仍可通过仓库更新持续维护',
              ),
              (
                  '- YAML 文件中的订阅地址、端口、DNS、IPv6、TUN 和控制器设置应根据实际环境检查。',
                  '- YAML 文件中的 Provider 地址应按实际情况填写；端口、DNS、IPv6、TUN、嗅探和控制器等运行参数应在 OpenClash LuCI 中配置。',
              ),
          ]
          for old, new in replacements:
              if old not in readme:
                  raise RuntimeError(f'expected README text not found: {old[:60]}')
              readme = readme.replace(old, new, 1)

          old_section = '\n'.join([
              '## 🧩 `Custom_Clash_DIY&Airport.yaml`',
              '',
              '[`Custom_Clash_DIY&Airport.yaml`](./yaml/Custom_Clash_DIY&Airport.yaml) 面向以下特定使用场景：',
              '',
              '- 自建节点作为优先出口',
              '- 机场订阅作为故障转移备用',
              '- 自建线路承担主要解锁和分流任务',
              '- 不同业务按照预设地区顺序自动回落',
              '',
              '该文件需要分别填写机场订阅和自建节点订阅，并未完整配置所有 DNS、IPv6 等运行参数。它属于独立的进阶配置，不对应根目录中的某个 `.ini` 模板。',
              '',
          ])
          new_section = '\n'.join([
              '## 🧩 自建节点优先配置',
              '',
              '两份自建节点配置均以自建线路作为主要出口，并以机场订阅作为故障转移后备。它们使用相同的策略组和分流规则，区别仅在于自建节点的导入方式。',
              '',
              '### 手工节点版',
              '',
              '[`Custom_Clash_Selfhosted_Manual_Fallback.yaml`](./yaml/Custom_Clash_Selfhosted_Manual_Fallback.yaml) 内置一个静态节点示例，适合直接填写 Mihomo 节点参数，或通过覆写模块逐字段替换节点内容。',
              '',
              '### Provider 版',
              '',
              '[`Custom_Clash_Selfhosted_Provider_Fallback.yaml`](./yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml) 使用独立的 `selfhost` Proxy Provider，适合加载以下 HTTP 节点来源：',
              '',
              '- Mihomo YAML Provider，内容以 `proxies:` 开头',
              '- 逐行排列的节点 URI 订阅',
              '- 上述 URI 订阅的 Base64 编码内容',
              '',
              '单条 `vless://`、`hysteria2://`、`tuic://` 等节点链接不能直接作为 HTTP Provider 地址；应先通过可信的本地转换服务生成可访问的订阅 URL，再写入 `selfhost.url`。',
              '',
              '> [!WARNING]',
              '> 自建节点链接通常包含服务器地址和认证凭据。通过公共转换服务处理单条节点链接时，服务端能够看到完整链接；优先使用自建转换服务或自行托管的 Provider 文件。',
              '',
          ])
          if old_section not in readme:
              raise RuntimeError('legacy self-hosted README section not found')
          readme = readme.replace(old_section, new_section, 1)
          readme_path.write_text(readme, encoding='utf-8', newline='\n')
          source_path.unlink()
          PY

      - name: Validate generated YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "Psych OK: #{file}" }' \
            cfg/yaml/Custom_Clash_Selfhosted_Manual_Fallback.yaml \
            cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml

          python - <<'PY'
          from pathlib import Path
          manual = Path('cfg/yaml/Custom_Clash_Selfhosted_Manual_Fallback.yaml').read_text(encoding='utf-8')
          provider = Path('cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml').read_text(encoding='utf-8')
          readme = Path('cfg/README.md').read_text(encoding='utf-8')
          assert '\nproxies:\n' in manual
          assert '\nproxies:\n' not in provider
          assert '\n  selfhost:\n' in provider
          assert 'use:\n      - selfhost' in provider
          assert 'Custom_Clash_Selfhosted_Fallback.yaml' not in readme
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/migrate-selfhosted-yaml.yml
          git add -- cfg/README.md cfg/yaml/Custom_Clash_Selfhosted_Manual_Fallback.yaml cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml cfg/yaml/Custom_Clash_Selfhosted_Fallback.yaml
          git commit -m "feat(config): add self-hosted provider variant"
          git push origin HEAD:main
