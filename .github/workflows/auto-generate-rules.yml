name: Auto generate rules

on:
  push:
    branches:
      - main
    paths:
      - 'rule/Custom_Direct.list'
      - 'rule/Custom_Proxy.list'
      - 'rule/Steam_CDN.list'
      - 'rule/Encrypted_DNS.list'
      - 'rule/Game_Download_CDN.list'
      - 'py/generate_rules.py'
  workflow_dispatch:
    inputs:
      source_before_sha:
        description: Source-list parent revision supplied by an updater workflow
        required: false
        type: string

permissions:
  contents: write

# All workflows that commit to main share this queue to avoid push races.
concurrency:
  group: main-writers

jobs:
  generate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      purge_base_sha: ${{ steps.publication-range.outputs.purge_base_sha }}
      validation_sha: ${{ steps.publish.outputs.validation_sha }}

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Record source publication range
        id: publication-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          REQUEST_BEFORE: ${{ inputs.source_before_sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            purge_base_sha="$EVENT_BEFORE"
          else
            purge_base_sha="$REQUEST_BEFORE"
          fi

          if [ -z "$purge_base_sha" ]; then
            purge_base_sha="$(git rev-parse HEAD^)"
          elif [ "${purge_base_sha//0/}" != "" ]; then
            purge_base_sha="$(git rev-parse "${purge_base_sha}^{commit}")"
          fi

          echo "Source publication base: $purge_base_sha"
          echo "purge_base_sha=$purge_base_sha" >> "$GITHUB_OUTPUT"

      - name: Download and verify Mihomo
        env:
          MIHOMO_VERSION: v1.19.18
          MIHOMO_SHA256: bbad6c9fa6322d870e94aab34b54097ffc880829be8fd804de79543d87f1f8e5
        run: |
          archive="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          wget -q "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${archive}"
          printf '%s  %s\n' "$MIHOMO_SHA256" "$archive" | sha256sum --check --strict
          gunzip "$archive"
          install -m 0755 "${archive%.gz}" "$RUNNER_TEMP/mihomo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate YAML and MRS providers
        run: python py/generate_rules.py --mihomo mihomo

      - name: Test generation and conversion logic
        run: python py/generate_rules.py --check --mihomo mihomo

      - name: Commit and push changes
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rule-Bot may push while this job is running. Regenerate from the
          # newest source instead of rebasing stale derived files over it.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            python py/generate_rules.py --mihomo mihomo
            python py/generate_rules.py --check --mihomo mihomo
          fi

          git add -- rule/*.yaml rule/*.mrs

          if git diff --cached --quiet; then
            echo "No generated rule changes, skip commit and push."
          else
            git commit -m "chore(rules): auto generate derived rule files"
            git push origin HEAD:main
          fi

          validation_sha="$(git rev-parse HEAD)"
          echo "Final revision to validate: $validation_sha"
          echo "validation_sha=$validation_sha" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not trigger push workflows. Call the shared
  # validation directly so the final generated revision cannot bypass CI.
  validate-generated:
    needs: generate-rules
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      expected_sha: ${{ needs.generate-rules.outputs.validation_sha }}

  # Publish only after the exact final revision has passed the shared validator.
  # This explicit call also works for GITHUB_TOKEN commits, which emit no push event.
  purge-generated:
    needs:
      - generate-rules
      - validate-generated
    permissions:
      contents: read
    uses: ./.github/workflows/purge-jsdelivr.yml
    with:
      before_sha: ${{ needs.generate-rules.outputs.purge_base_sha }}
      after_sha: ${{ needs.generate-rules.outputs.validation_sha }}
